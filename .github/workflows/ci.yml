name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # As mesmas versões que o app instala em Configurações → Ferramentas (internal/tools).
  GOPLS_MODULE: golang.org/x/tools/gopls@v0.22.0
  DLV_MODULE: github.com/go-delve/delve/cmd/dlv@v1.27.2

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal main.go)
          if [ -n "$unformatted" ]; then
            echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./internal/... ./cmd/...
      - name: Instalar gopls e Delve (os testes usam os de verdade)
        run: |
          go install "$GOPLS_MODULE"
          go install "$DLV_MODULE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: git para os testes
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - name: go test
        run: go test -race ./internal/... ./cmd/...

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários (inclui as traduções)
        run: npm run test:unit
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  app:
    name: Build do app (Wails)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Pacotes do sistema (GTK e WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: go build
        run: go build -tags desktop,production,webkit2_41 -o build/bin/prumo .

  e2e:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar gopls e Delve
        run: |
          go install "$GOPLS_MODULE"
          go install "$DLV_MODULE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: git para os testes
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - run: npm ci
      # O Playwright usa o Google Chrome instalado (channel: 'chrome'), que já vem no runner.
      - name: Playwright
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/e2e/.run/report
            frontend/e2e/.run/results
          retention-days: 7
